<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置中心 - 聆心小开</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #EBE6DF;
      --bg-end: #F4F1EB;
      --text-main: #5C544B;
      --text-sub: #9E968D;
      --accent: #B59C82;
      --accent-hover: #9E856C;
      --accent-light: #E8DDD2;
      --accent-dark: #7A6A58;
      --shadow: rgba(92,84,75,0.12);
    }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      margin: 0;
    }
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      padding: 0.75rem 1.5rem;
      box-shadow: 0 2px 16px var(--shadow);
      z-index: 100;
    }
    .nav-bar a {
      color: rgba(255,255,255,0.95);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-bar a:hover { color: #fff; }
    .settings-container {
      max-width: 640px;
      margin: 5rem auto 2rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 16px 48px var(--shadow);
      border: 1px solid rgba(255,255,255,0.9);
      overflow: hidden;
    }
    .settings-header {
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      color: #fff;
      padding: 1.75rem 2rem;
    }
    .settings-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 1px;
    }
    .settings-content {
      padding: 2rem;
    }
    .settings-section {
      margin-bottom: 2rem;
    }
    .settings-section:last-of-type { margin-bottom: 0; }
    .settings-section-title {
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent-light);
    }
    .settings-item {
      display: flex;
      align-items: center;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      transition: all 0.3s ease;
      margin-bottom: 0.5rem;
    }
    .settings-item:hover {
      background: var(--accent-light);
    }
    .settings-item i {
      width: 36px;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .settings-item-content { flex: 1; }
    .settings-item-label {
      font-weight: 600;
      color: var(--text-main);
    }
    .settings-item-description {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 0.25rem;
    }
    .form-switch .form-check-input {
      width: 2.5rem;
      height: 1.25rem;
      background-color: var(--accent-light);
      border-color: var(--accent);
    }
    .form-switch .form-check-input:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .btn-save {
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      color: #fff;
      border: none;
      padding: 0.75rem 2.5rem;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(181,156,130,0.3);
      transition: all 0.3s ease;
    }
    .btn-save:hover {
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(181,156,130,0.4);
    }

    /* ====== 多端适配 ====== */
    /* 大平板/iPad（769-1024px） */
    @media (min-width: 769px) and (max-width: 1024px) {
      .settings-container { max-width: 720px; margin: 5rem auto 2rem; }
    }
    /* 小平板（481-768px） */
    @media (min-width: 481px) and (max-width: 768px) {
      body { padding: 1.5rem 1rem; }
      .settings-container { max-width: 100%; margin: 4.5rem auto 1.5rem; }
      .settings-content { padding: 1.5rem; }
      .settings-header { padding: 1.5rem; }
    }
    /* 手机（<=480px） */
    @media (max-width: 480px) {
      body { padding: 1rem 0.75rem; }
      .nav-bar { padding: 0.6rem 1rem; }
      .settings-container { margin: 4rem auto 1rem; border-radius: 18px; }
      .settings-header { padding: 1.25rem 1rem; }
      .settings-header h1 { font-size: 1.25rem; }
      .settings-content { padding: 1.25rem 1rem; }
      .settings-section { margin-bottom: 1.5rem; }
      .settings-section-title { font-size: 0.95rem; }
      .settings-item { padding: 0.85rem 0.9rem; border-radius: 12px; flex-wrap: wrap; }
      .settings-item i { width: 28px; font-size: 1rem; }
      .settings-item-label { font-size: 0.95rem; }
      .settings-item-description { font-size: 0.78rem; }
      .btn-save { padding: 0.65rem 1.8rem; font-size: 0.92rem; }
    }
    /* 超大屏（>=1400px） */
    @media (min-width: 1400px) {
      .settings-container { max-width: 760px; }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <a href="index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
  </nav>

  <div class="settings-container">
    <div class="settings-header">
      <h1><i class="fas fa-cog me-2"></i>设置中心</h1>
    </div>
    <div class="settings-content">
      <form id="settingsForm">
        <div class="settings-section">
          <h3 class="settings-section-title">通知设置</h3>
          <div class="settings-item">
            <i class="fas fa-bell"></i>
            <div class="settings-item-content">
              <div class="settings-item-label">消息通知</div>
              <div class="settings-item-description">接收新消息和系统通知</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="notifications" checked>
            </div>
          </div>
          <div class="settings-item">
            <i class="fas fa-envelope"></i>
            <div class="settings-item-content">
              <div class="settings-item-label">邮件通知</div>
              <div class="settings-item-description">接收重要更新和活动通知</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="emailNotifications">
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">隐私设置</h3>
          <div class="settings-item">
            <i class="fas fa-user-shield"></i>
            <div class="settings-item-content">
              <div class="settings-item-label">显示在线状态</div>
              <div class="settings-item-description">允许其他用户看到你的在线状态</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="onlineStatus" checked>
            </div>
          </div>
          <div class="settings-item">
            <i class="fas fa-history"></i>
            <div class="settings-item-content">
              <div class="settings-item-label">保存聊天记录</div>
              <div class="settings-item-description">自动保存与AI助手的对话记录</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="saveChatHistory" checked>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">界面设置</h3>
          <div class="settings-item">
            <i class="fas fa-moon"></i>
            <div class="settings-item-content">
              <div class="settings-item-label">深色模式</div>
              <div class="settings-item-description">切换到深色主题界面</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="darkMode">
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-save">
            <i class="fas fa-save me-2"></i>保存设置
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('settingsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('设置已保存！');
    });
  </script>
</body>
</html>
