<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聆心小开 - 一叶知春</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-start: #EBF0EC;
      --bg-end: #F7FAF8;
      --text-main: #4A5D52;
      --text-sub: #87998D;
      --accent-color: #7DA48D;
      --accent-hover: #658A74;
      --border-color: rgba(125,164,141,0.3);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: 'PingFang SC', -apple-system, 'Helvetica Neue', Arial, sans-serif; color: var(--text-main); overflow-x: hidden; }

    /* 登录遮罩层 */
    #login-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 12vw; box-sizing: border-box;
    }
    #login-overlay.hide {
      animation: hideOverlay 1.2s forwards;
      pointer-events: none;
    }
    @keyframes hideOverlay { to { opacity: 0; } }
    #canvas-container { position: absolute; inset: 0; z-index: 0; }
    .ui-container {
      position: relative; z-index: 10;
      display: flex; width: 100%; height: 100%;
      align-items: center; justify-content: flex-end;
      padding-right: 12vw; box-sizing: border-box;
      animation: fadeInUI 1.2s cubic-bezier(0.25,0.8,0.25,1) forwards;
      pointer-events: none;
    }
    .ui-container * { pointer-events: auto; }
    @keyframes fadeInUI { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    .login-card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 24px;
      width: 380px;
      padding: 45px;
      box-shadow: 0 30px 60px rgba(74,93,82,0.08), inset 0 0 0 1px rgba(255,255,255,0.7);
      transition: all 1s cubic-bezier(0.25,1,0.3,1);
    }
    .login-card.fade-out {
      opacity: 0;
      transform: scale(0.95) translateY(-10px);
      pointer-events: none;
      filter: blur(10px);
    }
    .header { margin-bottom: 30px; }
    .title { font-size: 30px; font-weight: 600; margin: 0 0 10px; letter-spacing: 2px; color: #3A4A41; }
    .subtitle { font-size: 14px; color: var(--text-sub); margin: 0; line-height: 1.8; letter-spacing: 0.5px; }

    .auth-toggle {
      display: flex; position: relative;
      background: rgba(255,255,255,0.6);
      border-radius: 20px; margin-bottom: 25px; padding: 5px;
      border: 1px solid rgba(255,255,255,0.9);
    }
    .toggle-btn {
      flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600;
      cursor: pointer; z-index: 2; transition: color 0.3s; color: var(--text-sub);
    }
    .toggle-btn.active { color: var(--text-main); }
    .toggle-slider {
      position: absolute; top: 5px; left: 5px;
      width: calc(50% - 5px); height: calc(100% - 10px);
      background: #fff; border-radius: 16px;
      box-shadow: 0 2px 10px rgba(74,93,82,0.1);
      transition: 0.4s cubic-bezier(0.25,0.8,0.25,1); z-index: 1;
    }
    .auth-toggle.register-mode .toggle-slider { transform: translateX(100%); }

    .input-group { margin-bottom: 22px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; letter-spacing: 1px; }
    .input-group input {
      width: 100%; padding: 16px 20px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border-color);
      border-radius: 14px; box-sizing: border-box;
      font-size: 14px; color: var(--text-main);
      outline: none; transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
    }
    .input-group input:focus {
      background: #fff; border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(125,164,141,0.2);
      transform: translateY(-2px);
    }
    .input-group input::placeholder { color: #A6B3AC; }

    .submit-btn {
      width: 100%; padding: 18px; margin-top: 10px;
      background: var(--accent-color); color: white;
      border: none; border-radius: 30px;
      font-size: 16px; font-weight: 600; letter-spacing: 2px;
      cursor: pointer; transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
      box-shadow: 0 10px 25px rgba(125,164,141,0.3);
    }
    .submit-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(125,164,141,0.45);
    }

    .welcome-msg {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px; font-weight: 300; color: var(--text-main);
      opacity: 0; pointer-events: none; z-index: 5;
      letter-spacing: 4px; text-align: center; line-height: 1.6;
      transition: opacity 2s cubic-bezier(0.25,1,0.3,1);
    }

    /* 首页主内容（登录后显示） */
    #main-page {
      display: none;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    }
    #main-page.visible { display: block; }

    .app-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(125,164,141,0.15);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 100;
    }
    .app-bar .logo { font-size: 1.2rem; font-weight: 600; color: var(--text-main); }
    .app-bar .logo span { color: var(--accent-color); }
    .app-bar a { color: var(--text-main); text-decoration: none; }
    .main-content {
      padding: 90px 24px 60px;
      max-width: 520px;
      margin: 0 auto;
    }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 1.75rem; font-weight: 600; color: var(--text-main); margin: 0 0 8px; }
    .hero p { font-size: 0.95rem; color: var(--text-sub); margin: 0; }
    .section { margin-bottom: 28px; }
    .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-sub); letter-spacing: 1.5px; margin-bottom: 12px; }
    .feature-card {
      display: flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 16px;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(74,93,82,0.06);
      transition: all 0.3s ease;
    }
    .feature-card:hover {
      border-color: var(--accent-color);
      box-shadow: 0 12px 32px rgba(125,164,141,0.15);
      transform: translateY(-2px);
    }
    .feature-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .feature-card:nth-child(1) .feature-icon { background: #E8F0ED; color: var(--accent-color); }
    .feature-card:nth-child(2) .feature-icon { background: #E5F0E8; color: var(--accent-hover); }
    .feature-card:nth-child(3) .feature-icon { background: #EDF5F0; color: var(--accent-color); }
    .feature-text h3 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; color: var(--text-main); }
    .feature-text p { font-size: 0.85rem; color: var(--text-sub); margin: 0; line-height: 1.5; }
    .feature-arrow { margin-left: auto; color: var(--text-sub); }
    #backToTop {
      position: fixed; bottom: 24px; right: 24px;
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(125,164,141,0.2);
      color: var(--text-sub);
      cursor: pointer;
      display: none; align-items: center; justify-content: center;
      z-index: 99;
    }
    #backToTop:hover { color: var(--accent-color); }

    /* ====== 多端适配 ====== */
    /* 大平板/iPad 竖屏（769-1024px） */
    @media (min-width: 769px) and (max-width: 1024px) {
      #login-overlay, .ui-container { padding-right: 8vw; }
      .login-card { width: 360px; padding: 38px; }
      .main-content { max-width: 680px; padding: 90px 32px 60px; }
      .hero h1 { font-size: 2rem; }
      .feature-card { padding: 22px 26px; }
    }
    /* 小平板/大手机（481-768px） */
    @media (min-width: 481px) and (max-width: 768px) {
      #login-overlay { padding-right: 0; justify-content: center; }
      .ui-container { padding-right: 0; justify-content: center; }
      .login-card { width: 92%; max-width: 420px; padding: 36px 32px; }
      .main-content { max-width: 100%; padding: 80px 20px 50px; }
      .app-bar { padding: 0 16px; }
      .feature-card { padding: 18px 20px; }
    }
    /* 手机（<=480px） */
    @media (max-width: 480px) {
      #login-overlay { padding-right: 0; justify-content: center; }
      .ui-container { padding-right: 0; justify-content: center; padding: 0 16px; }
      .login-card { width: 100%; padding: 28px 22px; border-radius: 20px; }
      .title { font-size: 26px; }
      .subtitle { font-size: 13px; }
      .input-group input { padding: 14px 16px; }
      .submit-btn { padding: 16px; font-size: 15px; }
      .welcome-msg { font-size: 20px; letter-spacing: 2px; padding: 0 16px; }
      .app-bar { padding: 0 12px; height: 52px; }
      .app-bar .logo { font-size: 1.05rem; }
      .app-bar a span, .app-bar button span { display: none; }
      .main-content { padding: 70px 14px 40px; }
      .hero h1 { font-size: 1.5rem; }
      .hero p { font-size: 0.88rem; }
      .feature-card { padding: 16px 16px; gap: 12px; }
      .feature-icon { width: 42px; height: 42px; font-size: 1.1rem; }
      .feature-text h3 { font-size: 0.95rem; }
      .feature-text p { font-size: 0.8rem; }
      #backToTop { bottom: 16px; right: 16px; width: 40px; height: 40px; }
    }
    /* 大屏（>=1400px） */
    @media (min-width: 1400px) {
      .main-content { max-width: 680px; }
      .login-card { width: 420px; }
    }
    /* 横屏低高（如手机横屏） */
    @media (max-height: 480px) and (max-width: 900px) and (orientation: landscape) {
      #login-overlay { padding-right: 6vw; align-items: center; }
      .login-card { padding: 24px 30px; }
      .header { margin-bottom: 18px; }
      .input-group { margin-bottom: 14px; }
    }
  </style>
</head>
<body>
  <!-- 登录层 -->
  <div id="login-overlay">
    <div id="canvas-container"></div>
    <div class="ui-container">
      <div class="welcome-msg" id="welcome-msg">深呼吸...<br>万物复苏，心如止水</div>
      <div class="login-card" id="login-card">
        <div class="header">
          <h1 class="title">聆心小开</h1>
          <p class="subtitle">拾起一片落叶，放下万千思绪。<br>让烦恼化作飞叶，随春风消散。</p>
        </div>
        <div class="auth-toggle" id="auth-toggle">
          <div class="toggle-slider"></div>

        </form>
      </div>
    </div>
  </div>

  <!-- 首页主内容 -->
  <div id="main-page">
    <header class="app-bar">
      <a href="#" class="logo">聆心<span>小开</span></a>
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="profile.html" style="color:var(--text-main);text-decoration:none;"><i class="fa-solid fa-user me-2"></i>个人中心</a>
        <a href="settings.html" style="color:var(--text-main);text-decoration:none;"><i class="fa-solid fa-gear me-2"></i>设置</a>
        <button onclick="logout()" style="background:none;border:1px solid var(--border-color);color:var(--text-sub);padding:6px 14px;border-radius:12px;cursor:pointer;font-size:0.9rem;">
          <i class="fa-solid fa-right-from-bracket me-2"></i>退出登录
        </button>
      </div>
    </header>
    <main class="main-content">
      <section class="hero">
        <h1>聆心小开</h1>
        <p>在这里，每一个情绪都值得被倾听</p>
      </section>
      <section class="section">
        <h2 class="section-title">心理聊愈</h2>
        <a href="index（心理科普）.html" class="feature-card">
          <div class="feature-icon"><i class="fa-solid fa-lightbulb"></i></div>
          <div class="feature-text">
            <h3>解惑助手</h3>
            <p>心理知识科普，解答疑惑，了解自己与他人</p>
          </div>
          <i class="fa-solid fa-chevron-right feature-arrow"></i>
        </a>
        <a href="index（心理陪伴）.html" class="feature-card">
          <div class="feature-icon"><i class="fa-solid fa-comments"></i></div>

      <section class="section">
        <h2 class="section-title">应用</h2>
        <a href="./聆心小开.apk" class="feature-card" download="聆心小开.apk">
          <div class="feature-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
          <div class="feature-text">
            <h3>下载 APP</h3>
            <p>Android · 版本 1.0.0 · 随时随地使用</p>

    </main>
    <button id="backToTop" aria-label="返回顶部"><i class="fa-solid fa-arrow-up"></i></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const LOGIN_KEY = 'lx_logged_in';
    const LOGIN_USER = 'lx_user';

    let isRegisterMode = false;
    function switchMode(mode) {
      const toggleWrap = document.getElementById('auth-toggle');
      const btns = document.querySelectorAll('.toggle-btn');
      const submitBtn = document.getElementById('submit-btn');
      if (mode === 'register' && !isRegisterMode) {
        isRegisterMode = true;
        toggleWrap.classList.add('register-mode');
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
        submitBtn.innerText = '注册';
      } else if (mode === 'login' && isRegisterMode) {
        isRegisterMode = false;
        toggleWrap.classList.remove('register-mode');
        btns[1].classList.remove('active');
        btns[0].classList.add('active');
        submitBtn.innerText = '登录';
      }
    }

    function showMainPage() {
      document.getElementById('login-overlay').classList.add('hide');
      document.getElementById('main-page').classList.add('visible');
      setTimeout(() => document.getElementById('login-overlay').style.display = 'none', 1200);
    }

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2('#F7FAF8', 0.012);
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 80);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const createDewTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.85)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(32, 32, 30, 0, Math.PI * 2);
        ctx.fill();
        return new THREE.CanvasTexture(canvas);
      };

      const leafGroup = new THREE.Group();
      const particleCount = 35000;
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const velocities = [];
      const colorVein = new THREE.Color('#3A5A48');
      const colorMid = new THREE.Color('#7DA48D');
      const colorEdge = new THREE.Color('#EAF2EC');
      const leafLength = 45, leafMaxWidth = 18;

      for (let i = 0; i < particleCount; i++) {
        const u = Math.random();
        const v = (Math.random() - 0.5) * 2;
        const widthFactor = Math.sin(u * Math.PI) * (1 - Math.pow(u, 2.5));
        let px = v * leafMaxWidth * widthFactor;
        let py = u * leafLength - leafLength * 0.4;
        let pz = Math.abs(v) * 6 - Math.sin(u * Math.PI * 1.5) * 5;
        px += Math.sin(u * Math.PI) * 8;
        px += (Math.random() - 0.5) * 0.2;
        py += (Math.random() - 0.5) * 0.2;
        pz += (Math.random() - 0.5) * 0.2;
        positions[i * 3] = px;
        positions[i * 3 + 1] = py;
        positions[i * 3 + 2] = pz;
        let c = new THREE.Color();
        let absV = Math.abs(v);
        if (absV < 0.2) c.copy(colorVein).lerp(colorMid, absV / 0.2);
        else c.copy(colorMid).lerp(colorEdge, Math.pow((absV - 0.2) / 0.8, 1.5));
        c.multiplyScalar(0.7 + u * 0.3);
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
        velocities.push({ x: 0, y: 0, z: 0 });
      }

      const leafGeo = new THREE.BufferGeometry();
      leafGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      leafGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const leafMat = new THREE.PointsMaterial({
        size: 1.1, vertexColors: true, map: createDewTexture(),
        transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.NormalBlending
      });
      const leaf = new THREE.Points(leafGeo, leafMat);
      leaf.rotation.z = -Math.PI * 0.15;
      leaf.rotation.y = Math.PI * 0.1;
      leaf.rotation.x = Math.PI * 0.05;
      leafGroup.add(leaf);
      leafGroup.position.x = window.innerWidth > 900 ? -18 : 0;
      scene.add(leafGroup);

      const dustGeo = new THREE.BufferGeometry();
      const dustPos = new Float32Array(150 * 3);
      for (let i = 0; i < 150 * 3; i++) dustPos[i] = (Math.random() - 0.5) * 120;
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      const dustMat = new THREE.PointsMaterial({
        size: 1.8, color: 0xFFFFFF, map: createDewTexture(),
        transparent: true, opacity: 0.4, depthWrite: false
      });
      const dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);

      let targetCameraX = 0, targetCameraY = 5, isBursting = false;

      document.addEventListener('mousemove', (e) => {
        if (isBursting) return;
        const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        targetCameraX = mouseX * 8;
        targetCameraY = 5 + mouseY * 8;
      });

      function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;
        if (!isBursting) {
          const scale = 1 + Math.sin(time * 1.5) * 0.015;
          leafGroup.scale.set(scale, scale, scale);
          leafGroup.position.y = Math.sin(time * 0.8) * 1.5;
          camera.position.x += (targetCameraX - camera.position.x) * 0.03;
          camera.position.y += (targetCameraY - camera.position.y) * 0.03;
          camera.lookAt(0, 0, 0);
          dustParticles.rotation.y = time * 0.05;
          dustParticles.position.y = Math.sin(time * 0.5) * 2;
        } else {
          const fPos = leafGeo.attributes.position.array;
          for (let i = 0; i < particleCount; i++) {
            let v = velocities[i];
            let px = fPos[i*3], py = fPos[i*3+1], pz = fPos[i*3+2];
            let angle = Math.atan2(pz, px);
            let radius = Math.sqrt(px*px + pz*pz);
            v.x += -Math.sin(angle) * 0.5 + (px/(radius||1)) * 0.15;
            v.z += Math.cos(angle) * 0.5 + (pz/(radius||1)) * 0.15;
            v.y += 0.2 + Math.random() * 0.1;
            fPos[i*3] += v.x; fPos[i*3+1] += v.y; fPos[i*3+2] += v.z;
            v.x *= 0.96; v.y *= 0.96; v.z *= 0.96;
          }
          leafGeo.attributes.position.needsUpdate = true;
          dustParticles.position.y += 0.2;
          dustParticles.rotation.y += 0.02;
          if (leafMat.opacity > 0) {
            leafMat.opacity -= 0.005;
            dustMat.opacity -= 0.005;
          }
        }
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (!isBursting) leafGroup.position.x = window.innerWidth > 900 ? -18 : 0;
      });

      return { leafGroup, leafGeo, leafMat, dustMat, startBurst: () => {
        isBursting = true;
        leafGroup.updateMatrixWorld();
        leafGeo.applyMatrix4(leafGroup.matrixWorld);
        leafGroup.position.set(0,0,0);
        leafGroup.rotation.set(0,0,0);
        leafGroup.scale.set(1,1,1);
      }};
    }

    let threeScene = null;

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return;

      const loginCard = document.getElementById('login-card');
      const welcomeMsg = document.getElementById('welcome-msg');

      loginCard.classList.add('fade-out');

      if (threeScene && threeScene.startBurst) threeScene.startBurst();

      setTimeout(() => {
        welcomeMsg.style.opacity = '1';
        localStorage.setItem(LOGIN_KEY, '1');
        localStorage.setItem(LOGIN_USER, JSON.stringify({ nickname: username }));
        setTimeout(() => {
          showMainPage();
        }, 2500);
      }, 400);
    });

    if (localStorage.getItem(LOGIN_KEY) === '1') {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('main-page').classList.add('visible');
    } else {
      threeScene = initThreeJS();
    }

    const backTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => backTop.style.display = window.scrollY > 300 ? 'flex' : 'none');
    backTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } catch (_) {
        // 忽略：仍然执行前端登出
      }
      localStorage.removeItem('lx_logged_in');
      localStorage.removeItem('lx_user');

      const main = document.getElementById('main-page');
      const overlay = document.getElementById('login-overlay');
      const card = document.getElementById('login-card');
      const welcome = document.getElementById('welcome-msg');

      if (main) main.classList.remove('visible');
      if (overlay) {
        overlay.classList.remove('hide');
        overlay.style.display = 'flex';
      }
      if (card) card.classList.remove('fade-out');
      if (welcome) welcome.style.opacity = '0';

      // 重新初始化动画（如之前未初始化）
      if (!threeScene) {
        threeScene = initThreeJS();
      }
    }
  </script>
</body>
</html>
