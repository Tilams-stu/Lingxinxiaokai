<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7DA48D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="聆心小开">
  <title>聆心小开 · 倾诉空间</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-start: #EBF2ED;
      --bg-end: #F8FBF9;
      --text-main: #3A4A41;
      --text-sub: #7A8F83;
      --text-faint: #A6B3AC;
      --accent: #7DA48D;
      --accent-deep: #658A74;
      --accent-soft: #DCE8E1;
      --accent-glow: rgba(125,164,141,0.28);
      --glass: rgba(255,255,255,0.55);
      --glass-strong: rgba(255,255,255,0.78);
      --glass-border: rgba(255,255,255,0.8);
      --shadow-sm: 0 2px 8px rgba(74,93,82,0.06);
      --shadow-md: 0 6px 20px rgba(74,93,82,0.08);
      --shadow-lg: 0 16px 48px rgba(74,93,82,0.12);
      --sidebar-w: 264px;
      --header-h: 64px;
      --chat-pad-x: clamp(16px, 6vw, 96px);
      --bubble-max: min(680px, 72%);
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; }

    #canvas-container {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ===== Layout ===== */
    .app-layout {
      position: relative; z-index: 10;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      width: 100%; height: 100%;
      min-height: 0;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      grid-column: 1;
      display: flex; flex-direction: column;
      padding: 22px 14px;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border-right: 1px solid var(--glass-border);
      box-shadow: 4px 0 24px rgba(0,0,0,0.02);
      min-height: 0; height: 100%;
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-brand {
      display: flex; align-items: center; gap: 12px;
      padding: 4px 10px 22px;
    }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff; display: grid; place-items: center;
      font-size: 17px; box-shadow: 0 6px 16px rgba(125,164,141,0.4);
    }
    .brand-text { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }

    .nav-title {
      font-size: 11px; color: var(--text-sub); margin: 6px 12px 8px;
      font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    }

    .nav-menu { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 14px;
      color: var(--text-main); text-decoration: none;
      font-size: 14.5px; font-weight: 500;
      background: none; border: 1px solid transparent;
      width: 100%; text-align: left; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }
    .nav-item i { font-size: 15px; width: 18px; text-align: center; color: var(--text-sub); transition: color 0.2s; }

    .nav-item:hover {
      background: rgba(255,255,255,0.72);
      border-color: var(--glass-border);
    }
    .nav-item:hover i { color: var(--accent); }

    .nav-item.active {
      background: #fff;
      color: var(--accent-deep);
      border-color: var(--glass-border);
      box-shadow: 0 4px 14px rgba(125,164,141,0.18);
    }
    .nav-item.active i { color: var(--accent); }

    .user-profile {
      margin-top: 14px;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.55); border-radius: 14px;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .user-profile:hover { background: #fff; box-shadow: var(--shadow-sm); }
    .user-avatar { width: 38px; height: 38px; border-radius: 11px; overflow: hidden; flex-shrink: 0; background: var(--accent-soft); }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-status { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #E57373; box-shadow: 0 0 6px rgba(229,115,115,0.5); }

    /* ===== Chat main ===== */
    .chat-main {
      grid-column: 2;
      display: grid;
      grid-template-rows: var(--header-h) 1fr auto;
      min-width: 0; min-height: 0; height: 100%;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }

    .top-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      background: linear-gradient(to bottom, rgba(255,255,255,0.55), transparent);
    }
    .header-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header-title .title-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.65); border: 1px solid var(--glass-border);
      color: var(--text-sub); cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover { background: #fff; color: var(--accent); transform: translateY(-2px); }

    /* ===== Chat area ===== */
    .chat-area {
      overflow-y: auto; overflow-x: hidden;
      padding: 28px var(--chat-pad-x) 12px;
      scroll-behavior: smooth;
      min-height: 0;
      position: relative;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(125,164,141,0.28); border-radius: 3px; }
    .chat-area::-webkit-scrollbar-thumb:hover { background: rgba(125,164,141,0.45); }

    .chat-inner { max-width: 980px; margin: 0 auto; }

    /* ===== Message bubbles ===== */
    .msg {
      display: flex; align-items: flex-end; gap: 10px;
      margin-bottom: 18px;
      animation: msgIn 0.36s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 12px;
      display: grid; place-items: center;
      flex-shrink: 0; font-size: 15px;
      box-shadow: var(--shadow-sm);
      border: 2px solid #fff;
    }
    .msg.assistant .msg-avatar { background: rgba(255,255,255,0.95); color: #C75C7A; }
    .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent-deep), var(--accent)); color: #fff; }

    .msg-content-wrap { display: flex; flex-direction: column; max-width: var(--bubble-max); }
    .msg.user .msg-content-wrap { align-items: flex-end; }
    .msg.assistant .msg-content-wrap { align-items: flex-start; }

    .msg-body {
      padding: 12px 16px; font-size: 14.8px; line-height: 1.65;
      word-wrap: break-word; overflow-wrap: anywhere;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .msg.user .msg-body {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 6px 18px rgba(125,164,141,0.28);
    }
    .msg.assistant .msg-body {
      background: var(--glass-strong);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: var(--text-main);
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }
    .msg-body:hover { transform: translateY(-1px); }
    .msg-body p { margin: 0 0 8px; }
    .msg-body p:last-child { margin: 0; }
    .msg-body code {
      background: rgba(125,164,141,0.14); color: var(--accent-deep);
      padding: 2px 6px; border-radius: 6px; font-size: 0.92em;
    }
    .msg.user .msg-body code { background: rgba(255,255,255,0.22); color: #fff; }
    .msg.assistant .msg-body strong { color: #2A3830; }
    .msg-time { font-size: 11px; color: var(--text-faint); margin-top: 5px; padding: 0 6px; }

    .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: typing-b 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing-b { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* ===== Welcome card ===== */
    .welcome-card {
      max-width: 560px; margin: 4vh auto 16px;
      text-align: center; padding: 28px 22px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 22px; box-shadow: var(--shadow-md);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .welcome-card .wc-icon {
      width: 52px; height: 52px; margin: 0 auto 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff; display: grid; place-items: center; font-size: 22px;
      box-shadow: 0 10px 24px rgba(125,164,141,0.32);
    }
    .welcome-card h3 { margin: 0 0 6px; font-size: 18px; }
    .welcome-card p { margin: 0; font-size: 14px; color: var(--text-sub); line-height: 1.6; }
    .quick-chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin-top: 16px;
    }
    .quick-chip {
      padding: 8px 14px; border-radius: 18px;
      background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border);
      font-size: 13px; color: var(--text-main); cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .quick-chip:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

    /* ===== Scroll-to-bottom ===== */
    .scroll-btm {
      position: absolute; right: 24px; bottom: 16px;
      width: 38px; height: 38px; border-radius: 50%;
      background: #fff; color: var(--accent-deep);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
      display: none; place-items: center; cursor: pointer;
      z-index: 5; transition: transform 0.2s;
    }
    .scroll-btm.show { display: grid; }
    .scroll-btm:hover { transform: translateY(-2px); }

    /* ===== Input area ===== */
    .input-wrap {
      padding: 14px var(--chat-pad-x) 18px;
      background: linear-gradient(to top, rgba(235,242,237,0.96) 0%, rgba(235,242,237,0.55) 60%, transparent 100%);
      z-index: 20;
    }
    .input-inner { max-width: 980px; margin: 0 auto; }
    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 8px 8px 8px 18px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .input-row:focus-within {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 12px 32px rgba(125,164,141,0.18);
    }
    #input {
      flex: 1; border: none; outline: none; resize: none;
      background: transparent;
      padding: 11px 0;
      font-family: inherit; font-size: 15px; line-height: 1.5;
      color: var(--text-main);
      max-height: 140px; min-height: 22px;
      overflow-y: auto;
    }
    #input::-webkit-scrollbar { width: 4px; }
    #input::-webkit-scrollbar-thumb { background: rgba(125,164,141,0.3); border-radius: 2px; }
    #input::placeholder { color: var(--text-faint); }

    #send {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: #fff; cursor: pointer;
      display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(125,164,141,0.36);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    #send:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); box-shadow: 0 8px 22px rgba(125,164,141,0.5); }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; padding: 0 6px;
      font-size: 11px; color: var(--text-faint);
    }

    /* ===== Mobile toggle ===== */
    .menu-toggle {
      display: none; background: none; border: none;
      width: 36px; height: 36px; border-radius: 10px;
      font-size: 18px; color: var(--text-main); cursor: pointer;
    }
    .menu-toggle:hover { background: rgba(255,255,255,0.5); }

    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(58,74,65,0.35);
      backdrop-filter: blur(2px);
      opacity: 0; transition: opacity 0.25s;
    }
    .sidebar-backdrop.show { display: block; opacity: 1; }

    /* ===== Modal ===== */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(58,74,65,0.32); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 22px; width: 100%; max-width: 460px; max-height: 86vh;
      overflow-y: auto; box-shadow: var(--shadow-lg);
      animation: modalBoxIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    @keyframes modalBoxIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-close {
      border: none; background: rgba(255,255,255,0.7);
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; color: var(--text-sub); font-size: 18px;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover { background: #fff; color: var(--accent); }

    #radarChart { width: 100%; height: 280px; }
    .modal-tip { font-size: 13px; color: var(--text-sub); margin-top: 12px; line-height: 1.55; }

    .diary-textarea {
      width: 100%; min-height: 140px; padding: 13px;
      border-radius: 14px; border: 1px solid var(--glass-border);
      font-family: inherit; font-size: 14px; resize: vertical;
      background: rgba(255,255,255,0.75);
      transition: border-color 0.2s, background 0.2s;
    }
    .diary-textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
    .btn-primary {
      margin-top: 14px; padding: 11px 22px; border-radius: 20px; border: none;
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: #fff; font-size: 14.5px; cursor: pointer; font-weight: 500;
      box-shadow: 0 4px 14px rgba(125,164,141,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(125,164,141,0.4); }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .cal-day {
      padding: 12px 6px; border-radius: 12px;
      background: rgba(255,255,255,0.6); border: 1px solid var(--glass-border);
      font-size: 13px;
    }
    .cal-day span { display: block; font-size: 10.5px; color: var(--text-sub); margin-bottom: 4px; }

    /* ===== Responsive ===== */
    /* Tablet (769-1279) */
    @media (max-width: 1279px) {
      :root { --sidebar-w: 232px; --chat-pad-x: clamp(16px, 4vw, 56px); --bubble-max: 76%; }
      .sidebar { padding: 18px 12px; }
      .brand-text { font-size: 16px; }
      .nav-item { font-size: 14px; padding: 10px 12px; }
    }

    /* Mobile (<=768) */
    @media (max-width: 768px) {
      :root { --chat-pad-x: 14px; --header-h: 56px; --bubble-max: 86%; }
      .app-layout { grid-template-columns: 1fr; }
      .menu-toggle { display: grid; place-items: center; }
      .sidebar {
        position: fixed; top: 0; bottom: 0; left: 0;
        width: 280px; z-index: 9999;
        transform: translateX(-100%);
        background: rgba(255,255,255,0.97);
        backdrop-filter: none; -webkit-backdrop-filter: none;
        box-shadow: 6px 0 24px rgba(0,0,0,0.12);
      }
      .sidebar.open { transform: translateX(0); }
      .nav-item { min-height: 46px; }
      .user-profile { min-height: 48px; }
      .top-header { padding: 0 14px; }
      .header-title { font-size: 15px; }
      .msg { gap: 8px; margin-bottom: 14px; }
      .msg-avatar { width: 32px; height: 32px; font-size: 14px; }
      .msg-body { padding: 11px 14px; font-size: 14px; line-height: 1.6; }
      .input-row { padding: 6px 6px 6px 14px; }
      #input { font-size: 14.5px; padding: 9px 0; }
      #send { width: 40px; height: 40px; }
      .welcome-card { margin-top: 6vh; padding: 22px 18px; }
      .modal { padding: 14px; }
      .modal-box { padding: 18px; border-radius: 18px; }
      .calendar-grid { gap: 6px; }
      .cal-day { padding: 10px 4px; font-size: 12px; }
    }

    /* Landscape phone */
    @media (max-height: 480px) and (orientation: landscape) {
      :root { --header-h: 48px; }
      .chat-area { padding-top: 12px; }
      .input-wrap { padding-top: 10px; padding-bottom: 10px; }
      .welcome-card { margin-top: 12px; padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="fa-solid fa-heart"></i></div>
        <div class="brand-text">聆心小开</div>
      </div>

      <div class="nav-title">陪伴空间</div>
      <nav class="nav-menu">
        <button type="button" class="nav-item active" data-view="chat" id="navChat"><i class="fa-solid fa-comments"></i> 倾诉树洞</button>
        <button type="button" class="nav-item" data-action="emotion"><i class="fa-solid fa-chart-line"></i> 情绪分析</button>
        <button type="button" class="nav-item" data-action="diary"><i class="fa-solid fa-book"></i> 心理日记</button>
        <button type="button" class="nav-item" data-action="calendar"><i class="fa-solid fa-calendar"></i> 情绪日历</button>
        <a class="nav-item" href="/" id="navHome"><i class="fa-solid fa-house"></i> 返回首页</a>
        <button type="button" class="nav-item" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
      </nav>

      <div class="user-profile" id="userProfile" title="个人资料">
        <div class="user-avatar"><img id="userAvatarImg" src="https://api.dicebear.com/7.x/avataaars/svg?seed=heart" alt=""></div>
        <div class="user-info">
          <div class="user-name" id="userDisplayName">旅人</div>
          <div class="user-status"><span class="status-dot"></span> 正在倾听</div>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="top-header">
        <div class="header-title">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="菜单"><i class="fa-solid fa-bars"></i></button>
          <span class="title-dot"></span>
          <span>心理陪伴 · 倾诉空间</span>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" title="清空对话" id="btnClearChat" aria-label="清空对话"><i class="fa-solid fa-broom"></i></button>
        </div>
      </header>

      <div class="chat-area" id="chat">
        <div class="chat-inner" id="chatInner"></div>
        <button type="button" class="scroll-btm" id="scrollBtm" aria-label="滚动到底部"><i class="fa-solid fa-arrow-down"></i></button>
      </div>

      <div class="input-wrap">
        <div class="input-inner">
          <div class="input-row">
            <textarea id="input" rows="1" placeholder="说说你想聊的，我在这里倾听… （Enter 发送，Shift+Enter 换行）" autocomplete="off"></textarea>
            <button id="send" type="button" disabled aria-label="发送"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
          <div class="input-hint">
            <span>所有对话仅自己可见 · 不构成医学建议</span>
            <span id="charCount">0</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modalEmotion" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>情绪分析</h2>
        <button type="button" class="modal-close" data-close="modalEmotion" aria-label="关闭">&times;</button>
      </div>
      <div id="radarChart"></div>
      <p class="modal-tip" id="emotionTip"></p>
    </div>
  </div>

  <div class="modal" id="modalDiary" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>心理日记</h2>
        <button type="button" class="modal-close" data-close="modalDiary" aria-label="关闭">&times;</button>
      </div>
      <textarea class="diary-textarea" id="diaryText" placeholder="记录今日的心情与感悟…"></textarea>
      <button type="button" class="btn-primary" id="saveDiary">保存到本地</button>
    </div>
  </div>

  <div class="modal" id="modalCalendar" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>情绪日历</h2>
        <button type="button" class="modal-close" data-close="modalCalendar" aria-label="关闭">&times;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <p class="modal-tip">展示最近 7 天本地记录的心情关键词，多在日记里写写「开心」「平静」等情绪词，会逐步更新。</p>
    </div>
  </div>

  <script>
    let globalWindSpeed = 1.0;

    const initBackground = () => {
      const container = document.getElementById('canvas-container');
      if (typeof THREE === 'undefined') return;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2('#EBF2ED', 0.006);
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 60;
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const createTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(16, 16, 16, 0, Math.PI * 2); ctx.fill();
        return new THREE.CanvasTexture(canvas);
      };

      const particleCount = 450;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount * 3);
      const velocities = [];
      for (let i = 0; i < particleCount; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 150;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
        velocities.push({ x: (Math.random() - 0.5) * 0.02, y: Math.random() * 0.03 + 0.01 });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size: 1.2, color: 0x7DA48D, map: createTexture(),
        transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(geo, mat));

      let targetRotX = 0, targetRotY = 0;
      document.addEventListener('mousemove', (e) => {
        targetRotY = ((e.clientX / window.innerWidth) * 2 - 1) * 0.05;
        targetRotX = ((e.clientY / window.innerHeight) * 2 - 1) * 0.05;
      });

      let time = 0;
      const animate = () => {
        requestAnimationFrame(animate);
        time += 0.002;
        camera.position.x += (targetRotY * 20 - camera.position.x) * 0.05;
        camera.position.y += (-targetRotX * 20 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
        const positions = geo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const v = velocities[i];
          positions[i * 3] += v.x * globalWindSpeed + Math.sin(time * 3 + positions[i * 3 + 1] * 0.05) * 0.02 * globalWindSpeed;
          positions[i * 3 + 1] += v.y * globalWindSpeed;
          if (positions[i * 3 + 1] > 60) positions[i * 3 + 1] = -60;
        }
        geo.attributes.position.needsUpdate = true;
        if (globalWindSpeed > 1.0) globalWindSpeed += (1.0 - globalWindSpeed) * 0.02;
        renderer.render(scene, camera);
      };
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };
    initBackground();

    /* ====== State ====== */
    const chat = document.getElementById('chat');
    const chatInner = document.getElementById('chatInner');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const charCount = document.getElementById('charCount');
    const scrollBtm = document.getElementById('scrollBtm');
    const SYS = `你是开开，像朋友一样陪聊：接住对方的情绪，轻轻呼应 TA 说的话，温暖、不评判。每次回复全文不超过50字；少讲理论、不重复大道理。若谈及自杀或自残，先表达关心并建议向身边人或专业援助求助。`;
    const MAX_HIST = 20;
    const LS_COMPANION_SID = 'lx_companion_session_id';
    let history = [];
    let currentSessionId = null;
    let radarChart = null;

    function newCompanionId() {
      return 'companion-' + (typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    }
    function loadOrCreateSessionId() {
      let raw = localStorage.getItem(LS_COMPANION_SID);
      if (raw && raw.startsWith('companion-')) return raw;
      raw = newCompanionId();
      localStorage.setItem(LS_COMPANION_SID, raw);
      return raw;
    }

    async function hydrateCompanionHistory() {
      if (!currentSessionId) return;
      try {
        const r = await fetch('/api/users/me/messages?limit=2000', { credentials: 'include', cache: 'no-store' });
        if (!r.ok) return;
        const data = await r.json();
        const msgs = (data.messages || []).filter(
          m => m.session_id === currentSessionId && (m.role === 'user' || m.role === 'assistant')
        );
        msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        if (!msgs.length) return;
        history = msgs.map(m => ({ role: m.role, content: m.content }));
        chatInner.innerHTML = '';
        history.forEach(m => addMsg(m.content, m.role));
      } catch (_) {}
    }

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    async function checkAuth() {
      const r = await fetch('/api/users/me', { credentials: 'include', cache: 'no-store' });
      if (!r.ok) { location.href = '/login'; return false; }
      try {
        const data = await r.json();
        const u = data.user || data;
        const name = u.nickname || u.username || u.name || '旅人';
        document.getElementById('userDisplayName').textContent = name;
        const seed = encodeURIComponent(String(u.id || name));
        document.getElementById('userAvatarImg').src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + seed;
      } catch (_) {}
      return true;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    function md(s) {
      if (typeof marked !== 'undefined') {
        try { return marked.parse(s || ''); } catch (e) { return esc(s); }
      }
      return esc(s).replace(/\n/g, '<br>');
    }
    function getCurrentTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollChatBottom(smooth) {
      chat.scrollTo({ top: chat.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }

    chat.addEventListener('scroll', () => {
      const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
      scrollBtm.classList.toggle('show', !nearBottom);
    });
    scrollBtm.addEventListener('click', () => scrollChatBottom(true));

    function renderWelcome() {
      chatInner.innerHTML = `
        <div class="welcome-card">
          <div class="wc-icon"><i class="fa-solid fa-heart"></i></div>
          <h3>你好呀，我是聆心小开</h3>
          <p>有什么想聊的吗？不论是今天的烦恼还是心里的小事，我都会认真听。</p>
          <div class="quick-chips">
            <button type="button" class="quick-chip" data-q="今天有点累，想找人聊聊">今天有点累</button>
            <button type="button" class="quick-chip" data-q="我最近总是失眠，怎么办">最近失眠</button>
            <button type="button" class="quick-chip" data-q="心情有点低落，不知道为什么">心情低落</button>
            <button type="button" class="quick-chip" data-q="对未来感到迷茫">感到迷茫</button>
          </div>
        </div>`;
      chatInner.querySelectorAll('.quick-chip').forEach(b => {
        b.addEventListener('click', () => {
          input.value = b.dataset.q;
          autoResize();
          sendBtn.disabled = false;
          input.focus();
        });
      });
    }

    function addMsg(content, role) {
      // 首次添加消息时清掉欢迎卡片
      const wc = chatInner.querySelector('.welcome-card');
      if (wc) wc.remove();
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      row.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-${role === 'user' ? 'user' : 'heart'}"></i></div>
        <div class="msg-content-wrap">
          <div class="msg-body">${role === 'assistant' ? md(content) : esc(content).replace(/\n/g, '<br>')}</div>
          <div class="msg-time">${getCurrentTime()}</div>
        </div>`;
      chatInner.appendChild(row);
      scrollChatBottom(true);
    }

    function bumpWind() { globalWindSpeed = 8.0; }

    function pickApiError(data) {
      if (!data || typeof data !== 'object') return '';
      if (typeof data.message === 'string' && data.message) return data.message;
      const e = data.error;
      if (typeof e === 'string') return e;
      if (e && typeof e === 'object' && typeof e.message === 'string') return e.message;
      return '';
    }

    async function streamChat(text) {
      if (!(await checkAuth())) return;
      bumpWind();
      history.push({ role: 'user', content: text });
      addMsg(text, 'user');

      // 占位回复
      const wc = chatInner.querySelector('.welcome-card');
      if (wc) wc.remove();
      const row = document.createElement('div');
      row.className = 'msg assistant';
      row.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-heart"></i></div>
        <div class="msg-content-wrap">
          <div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>
          <div class="msg-time">${getCurrentTime()}</div>
        </div>`;
      chatInner.appendChild(row);
      const body = row.querySelector('.msg-body');
      const timeEl = row.querySelector('.msg-time');
      scrollChatBottom(true);

      let full = '';
      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            session_id: currentSessionId,
            messages: [{ role: 'system', content: SYS }, ...history.slice(-MAX_HIST)],
            max_tokens: 512,
            temperature: 0.7,
            stream: true
          })
        });
        if (r.status === 401) {
          const msg401 = '登录已过期，请重新登录后再试。';
          body.innerHTML = esc(msg401);
          history.push({ role: 'assistant', content: msg401 });
          setTimeout(() => { location.href = '/login'; }, 800);
          return;
        }
        if (!r.ok) {
          const errData = await r.json().catch(() => ({}));
          const msg = pickApiError(errData) || `请求失败（${r.status}）`;
          body.innerHTML = esc(msg);
          history.push({ role: 'assistant', content: msg });
          return;
        }
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const j = JSON.parse(line.slice(6));
                const d = j?.choices?.[0]?.delta;
                const piece = (d && (d.content || d.reasoning_content)) || '';
                if (piece) {
                  full += piece;
                  body.innerHTML = md(full);
                  timeEl.textContent = getCurrentTime();
                }
              } catch (_) {}
            }
          }
          scrollChatBottom(false);
        }
        body.innerHTML = md(full);
        timeEl.textContent = getCurrentTime();
        if (!full.trim()) {
          const err = '未收到模型回复，请检查接口配置或稍后再试。';
          body.innerHTML = esc(err);
          history.push({ role: 'assistant', content: err });
        } else {
          history.push({ role: 'assistant', content: full });
          try { localStorage.setItem('lx_companion_last_dialog', full.slice(0, 400)); } catch (_) {}
        }
      } catch (e) {
        const err = '网络好像打了个盹，稍后再试一下吧～';
        body.innerHTML = esc(err);
        history.push({ role: 'assistant', content: err });
      }
      scrollChatBottom(true);
    }

    async function analyzeEmotion() {
      if (!(await checkAuth())) return;
      openModal('modalEmotion');
      document.getElementById('emotionTip').textContent = '分析中…';
      const text = history.filter(m => m.role === 'user').map(m => m.content).join(' ') || '暂无对话';
      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            skip_persist: true,
            messages: [
              { role: 'system', content: '输出JSON，键为 happy,sad,angry,calm,surprised,fear，值0-1。只返回JSON。' },
              { role: 'user', content: '分析以下对话的情绪，输出JSON：' + text.slice(0, 500) }
            ],
            max_tokens: 200,
            stream: false
          })
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) { location.href = '/login'; return; }
        const raw = data?.choices?.[0]?.message?.content || data?.content || '';
        let emo = { happy: 0.3, sad: 0.2, angry: 0.1, calm: 0.4, surprised: 0.2, fear: 0.1 };
        try {
          const j = JSON.parse(raw.replace(/```\w*\n?|\n?```/g, '').trim());
          if (j && typeof j === 'object') emo = { ...emo, ...j };
        } catch (_) {}
        const names = { happy: '开心', sad: '悲伤', angry: '愤怒', calm: '平静', surprised: '惊讶', fear: '恐惧' };
        const vals = Object.entries(emo).map(([k, v]) => ({
          name: names[k] || k,
          value: Math.min(1, Math.max(0, Number(v) || 0))
        }));
        const el = document.getElementById('radarChart');
        if (radarChart) radarChart.dispose();
        radarChart = echarts.init(el);
        radarChart.setOption({
          radar: {
            indicator: vals.map(v => ({ name: v.name, max: 1 })),
            shape: 'polygon',
            splitArea: { areaStyle: { color: ['rgba(125,164,141,0.08)', 'rgba(125,164,141,0.03)'] } },
            axisLine: { lineStyle: { color: 'rgba(125,164,141,0.35)' } },
            splitLine: { lineStyle: { color: 'rgba(125,164,141,0.22)' } }
          },
          series: [{
            type: 'radar',
            data: [{
              value: vals.map(v => v.value),
              areaStyle: { color: 'rgba(125,164,141,0.28)' },
              lineStyle: { color: '#7da48d', width: 2 }
            }]
          }]
        });
        document.getElementById('emotionTip').textContent = '以上为基于本次对话的情绪分析，仅供参考，愿你心情平和～';
      } catch (e) {
        document.getElementById('emotionTip').textContent = '分析失败，请稍后重试。';
      }
    }

    function initDiary() {
      document.getElementById('diaryText').value = localStorage.getItem('lx_diary') || '';
    }
    function saveDiary() {
      const t = document.getElementById('diaryText').value;
      localStorage.setItem('lx_diary', t);
      updateCalendarFromText(t);
      closeModal('modalDiary');
    }
    const MOOD_KEYS = ['开心', '平静', '焦虑', '难过', '愤怒', '期待', '疲惫'];
    function localDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function updateCalendarFromText(text) {
      const found = MOOD_KEYS.find(k => text.includes(k)) || '平静';
      const key = 'lx_companion_cal';
      let arr = [];
      try {
        arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(arr)) arr = [];
      } catch (_) { arr = []; }
      const day = localDateStr();
      const i = arr.findIndex(x => x.d === day);
      if (i >= 0) arr[i].m = found;
      else { arr.push({ d: day, m: found }); arr = arr.slice(-14); }
      localStorage.setItem(key, JSON.stringify(arr));
    }
    function initCalendar() {
      const grid = document.getElementById('calendarGrid');
      let arr = [];
      try {
        arr = JSON.parse(localStorage.getItem('lx_companion_cal') || '[]');
        if (!Array.isArray(arr)) arr = [];
      } catch (_) { arr = []; }
      const map = Object.fromEntries(arr.map(x => [x.d, x.m]));
      const today = new Date();
      grid.innerHTML = Array.from({ length: 7 }, (_, i) => {
        const dt = new Date(today);
        dt.setDate(today.getDate() - (6 - i));
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        const ds = `${y}-${m}-${d}`;
        const mood = map[ds] || '—';
        const label = `${dt.getMonth() + 1}/${dt.getDate()}`;
        return `<div class="cal-day"><span>${label}</span>${mood}</div>`;
      }).join('');
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function setNavChatActive() {
      document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
      document.getElementById('navChat').classList.add('active');
    }
    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('show');
      document.body.classList.remove('sidebar-open');
    }
    function bindTap(el, handler) {
      let touched = false;
      el.addEventListener('touchstart', (e) => {
        touched = true; e.preventDefault(); handler(e);
      }, { passive: false });
      el.addEventListener('click', (e) => {
        if (touched) { touched = false; return; }
        handler(e);
      });
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      const len = input.value.length;
      charCount.textContent = len;
      charCount.style.color = len > 500 ? '#C75C7A' : '';
      sendBtn.disabled = !input.value.trim();
    }

    input.addEventListener('input', autoResize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        if (!sendBtn.disabled) sendBtn.click();
      }
    });

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('show', sidebar.classList.contains('open'));
      document.body.classList.toggle('sidebar-open', sidebar.classList.contains('open'));
    });
    menuToggle.addEventListener('touchstart', (e) => { e.preventDefault(); menuToggle.click(); }, { passive: false });
    sidebarBackdrop.addEventListener('click', closeMobileSidebar);
    sidebarBackdrop.addEventListener('touchstart', (e) => { e.preventDefault(); closeMobileSidebar(); }, { passive: false });

    bindTap(document.getElementById('navChat'), () => {
      setNavChatActive();
      closeMobileSidebar();
    });
    bindTap(document.getElementById('navHome'), (e) => {
      e.preventDefault();
      closeMobileSidebar();
      location.href = '/';
    });

    document.querySelectorAll('.nav-item[data-action]').forEach(btn => {
      bindTap(btn, () => {
        document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
        const act = btn.dataset.action;
        if (act === 'emotion') analyzeEmotion();
        if (act === 'diary') { initDiary(); openModal('modalDiary'); }
        if (act === 'calendar') { initCalendar(); openModal('modalCalendar'); }
        closeMobileSidebar();
      });
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => {
        closeModal(btn.dataset.close);
        setNavChatActive();
      });
    });

    document.getElementById('saveDiary').onclick = saveDiary;

    bindTap(document.getElementById('btnLogout'), async () => {
      try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include', cache: 'no-store' }); } catch (_) {}
      location.href = '/login';
    });

    document.getElementById('btnClearChat').onclick = async () => {
      if (!confirm('要清空当前对话吗？将删除服务器上本会话记录，并开启新会话。')) return;
      try {
        if (currentSessionId) {
          await fetch('/api/users/me/messages?session_id=' + encodeURIComponent(currentSessionId), {
            method: 'DELETE', credentials: 'include', cache: 'no-store'
          });
        }
      } catch (_) {}
      currentSessionId = newCompanionId();
      localStorage.setItem(LS_COMPANION_SID, currentSessionId);
      history = [];
      chatInner.innerHTML = '';
      renderWelcome();
    };

    bindTap(document.getElementById('userProfile'), () => { location.href = '/profile'; });

    sendBtn.onclick = () => {
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      autoResize();
      sendBtn.disabled = true;
      streamChat(t).finally(() => { sendBtn.disabled = !input.value.trim(); input.focus(); });
    };

    (async () => {
      if (!(await checkAuth())) return;
      currentSessionId = loadOrCreateSessionId();
      await hydrateCompanionHistory();
      if (history.length === 0) renderWelcome();
      autoResize();
    })();
  </script>
</body>
</html>
